### Option:Plugins.SAPAGENT.System.Path
#	Path to external plugin executable.
#
# Mandatory: yes
# Default:
# Plugins.SAPAGENT.System.Path=

### Option: Plugins.SAPAGENT.Timeout
#	The maximum amount of time to wait for a server to respond to SOAP requests.
#
# Mandatory: no
# Range: 1-30
# Default:
# Plugins.SAPAGENT.Timeout=<Global timeout>

### Option: Plugins.SAPAGENT.Sessions.*.Uri
#	Uri to connect. "*" should be replaced with a session name.
#
# Mandatory: no
# Range:
#   Must match the URI format.
#   Supported schemas: "http", "https" and "unix".
#   Embedded credentials will be ignored.
# Default:
# Plugins.SAPAGENT.Sessions.*.Uri=

### Option: Plugins.SAPAGENT.Sessions.*.Username
#	Username for session connection. "*" should be replaced with a session name.
#
# Mandatory: no
# Range: Must match the SAP Agent user name.
# Default:
# Plugins.SAPAGENT.Sessions.*.Username=

### Option: Plugins.SAPAGENT.Sessions.*.Password
#	Password for session connection. "*" should be replaced with a session name.
#
# Mandatory: no
# Range: Must match the Password format.
# Default:
# Plugins.SAPAGENT.Sessions.*.Password=

### Option: Plugins.SAPAGENT.Sessions.*.TLSRootCAFile
#	Full pathname of a file containing the top-level CA(s) certificate.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Sessions.*.TLSRootCAFile=

### Option: Plugins.SAPAGENT.Sessions.*.TLSServerName
#	TLS hostname used to verify the server certificate.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Sessions.*.TLSServerName=

### Option: Plugins.SAPAGENT.Sessions.*.TLSInsecureSkipVerify
#	Disable server's certificate chain and hostname verification.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Sessions.*.TLSInsecureSkipVerify=

### Option: Plugins.SAPAGENT.Default.Uri
#	Uri to connect. Default value used if no other is specified.
#
# Mandatory: no
# Range:
#   Must match the URI format.
#   Supported schemas: "http", "https" and "unix".
#   Embedded credentials will be ignored.
# Default:
# Plugins.SAPAGENT.Default.Uri=

### Option: Plugins.SAPAGENT.Default.Username
#	Username for session connection. Default value used if no other is specified.
#
# Mandatory: no
# Range: Must match SAP Agent user name.
# Default:
# Plugins.SAPAGENT.Default.Username=

### Option: Plugins.SAPAGENT.Default.Password
#	Password for session connection. Default value used if no other is specified.
#
# Mandatory: no
# Range: Must match the Password format.
# Default:
# Plugins.SAPAGENT.Default.Password=

### Option: Plugins.SAPAGENT.Default.TLSRootCAFile
#	Full pathname of a file containing the top-level CA(s) certificate.
#	Default value used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Default.TLSRootCAFile=

### Option: Plugins.SAPAGENT.Default.TLSServerName
#	TLS hostname used to verify the server certificate.
#	Default value used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Default.TLSServerName=

### Option: Plugins.SAPAGENT.Default.TLSInsecureSkipVerify
#	Disable server's certificate chain and hostname verification.
#	Default value used if no other is specified.
#
# Mandatory: no
# Default:
# Plugins.SAPAGENT.Default.TLSInsecureSkipVerify=
